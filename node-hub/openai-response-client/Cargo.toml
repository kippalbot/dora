[package]
name = "openai-response-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dora-node-api = { workspace = true }
eyre = "0.6.8"
futures = "0.3"
openai_dive = { path = "../../../../openai-client/openai_dive", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"

[[bin]]
name = "openai-response-client"
path = "main.rs"
