nodes:
  - id: NODE_ID
    # Do not build the server; it runs outside as a dynamic node
    path: dynamic
    inputs:
      audio: primespeech/audio
      text: asr/transcription
      speech_started: speech-monitor/speech_started
      speech_ended: speech-monitor/speech_ended
    outputs:
      - audio
      - text
      - log

  - id: speech-monitor
    path: dora-speechmonitor
    inputs:
      audio:
        source: NODE_ID/audio
        queue_size: 1000000
    outputs:
      - speech_started
      - speech_ended
      - question_ended
      - is_speaking
      - audio_segment
      - speech_probability
      - log
    env:
      MIN_AUDIO_AMPLITUDE: 0.01
      ACTIVE_FRAME_THRESHOLD_MS: 100
      USER_SILENCE_THRESHOLD_MS: 1500
      SILENCE_THRESHOLD_MS: 500
      QUESTION_END_SILENCE_MS: 3000
      AUDIO_FRAMES_THRESHOLD_MS: 10000
      VAD_THRESHOLD: 0.6
      VAD_ENABLED: true
      SAMPLE_RATE: 16000
      LOG_LEVEL: INFO

  - id: asr
    path: dora-asr
    inputs:
      audio:
        source: speech-monitor/audio_segment
        queue_size: 10
    outputs:
      - transcription
      - status
      - log
    env:
      # Prevent network downloads during initialization
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      FUNASR_DISABLE_UPDATE: "true"
      # Model settings
      ASR_MODELS_DIR: $HOME/.dora/models/asr
      ASR_ENGINE: funasr
      LANGUAGE: zh
      # GPU: set to false to use faster ONNX backend
      USE_GPU: "false"
      LOG_LEVEL: INFO

  - id: maas-client
    # Use prebuilt binary shipped in the image
    path: /usr/local/bin/dora-maas-client
    inputs:
      text: asr/transcription
      text_to_audio: NODE_ID/text
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: maas_mcp_browser_config.toml
      LOG_LEVEL: INFO

  - id: text-segmenter
    path: dora-text-segmenter
    inputs:
      text: maas-client/text
      tts_complete: primespeech/segment_complete
    outputs:
      - text_segment
      - status
      - metrics
      - log
    env:
      ENABLE_BACKPRESSURE: "false"
      SEGMENT_MODE: "sentence"
      MIN_SEGMENT_LENGTH: "5"
      MAX_SEGMENT_LENGTH: "20"
      PUNCTUATION_MARKS: "。！？.!?，,：:"
      LOG_LEVEL: "INFO"

  # PrimeSpeech TTS with MPS GPU acceleration
  - id: primespeech
    path: dora-primespeech
    inputs:
      text: text-segmenter/text_segment
    outputs:
      - audio
      - status
      - segment_complete
      - log
    env:
      # Prevent network downloads during initialization
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"

      # Voice selection (available: luoxiang, mayun, bys, dnz, yfc, doubao)
      VOICE_NAME: luoxiang
      PRIMESPEECH_MODEL_DIR: $HOME/.dora/models/primespeech

      # Language settings
      TEXT_LANG: zh
      PROMPT_LANG: zh

      # Inference parameters
      TOP_K: 5
      TOP_P: 1.0
      TEMPERATURE: 1.0
      SPEED_FACTOR: 1.1

      # Performance - MPS GPU acceleration (auto-detects on Mac)
      USE_GPU: "true"
      # DEVICE: mps  # Auto-detected, uncomment to force

      RETURN_FRAGMENT: "false"
      LOG_LEVEL: INFO

      # Internal text segmentation
      ENABLE_INTERNAL_SEGMENTATION: "true"
      TTS_MAX_SEGMENT_LENGTH: "100"
      TTS_MIN_SEGMENT_LENGTH: "20"

  - id: audio-player
    path: dynamic
    inputs:
      audio: primespeech/audio
    outputs:
      - buffer_status
      - status

  # Log viewer to monitor all node logs (dynamic node - launch separately)
  - id: viewer
    path: dynamic
    inputs:
      # Log outputs from all nodes
      wserver_log: NODE_ID/log
      speechmonitor_log: speech-monitor/log
      asr_log: asr/log
      maas_log: maas-client/log
      segmenter_log: text-segmenter/log
      primespeech_log: primespeech/log
      # Status outputs
      asr_status: asr/status
      maas_status: maas-client/status
      segmenter_status: text-segmenter/status
      primespeech_status: primespeech/status
    env:
      LOG_LEVEL: INFO
