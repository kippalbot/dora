# Conference Study Session with Makepad Dashboard
#
# Uses conference-dashboard (Rust/Makepad) instead of Python audio-player and debate-monitor
# Dashboard provides: audio playback, participant status, control buttons, log viewing
#
# Run dashboard with: DORA_NODE_ID=dashboard cargo run
# From: examples/conference-dashboard/

nodes:
  # ============ Study Participants (MaaS) ============

  - id: student1
    path: ../../target/release/dora-maas-client
    inputs:
      text: bridge-to-student1/text
      control: conference-controller/llm_control
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: study_config_maas_student1.toml
      ALIBABA_CLOUD_API_KEY: ${ALIBABA_CLOUD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LOG_LEVEL: INFO

  - id: student2
    path: ../../target/release/dora-maas-client
    inputs:
      text: bridge-to-student2/text
      control: conference-controller/llm_control
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: study_config_maas_student2.toml
      ALIBABA_CLOUD_API_KEY: ${ALIBABA_CLOUD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LOG_LEVEL: INFO

  - id: tutor
    path: ../../target/release/dora-maas-client
    inputs:
      text: bridge-to-tutor/text
      control: conference-controller/judge_prompt
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: study_config_maas_tutor.toml
      ALIBABA_CLOUD_API_KEY: ${ALIBABA_CLOUD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LOG_LEVEL: INFO

  # ============ Audio Pipeline for Tutor ============

  - id: tutor-text-segmenter
    build: pip install -e ../../node-hub/dora-text-segmenter
    path: dora-text-segmenter
    inputs:
      text:
        source: tutor/text
        queue_size: 1000
      tts_complete: primespeech-tutor/segment_complete
      reset: conference-controller/control_judge
    outputs:
      - text_segment
      - status
      - metrics
      - log
    env:
      SEGMENTER_MODE: "single"
      ENABLE_BACKPRESSURE: "false"
      SEGMENT_MODE: "sentence"
      MIN_SEGMENT_LENGTH: "5"
      MAX_SEGMENT_LENGTH: "15"
      PUNCTUATION_MARKS: '。！？.!?，,、；：""''（）【】《》'
      REMOVE_SPEAKER_ID: "true"
      LOG_LEVEL: "INFO"

  - id: primespeech-tutor
    build: pip install -e ../../node-hub/dora-primespeech
    path: dora-primespeech
    inputs:
      text: tutor-text-segmenter/text_segment
    outputs:
      - audio
      - status
      - segment_complete
      - log
    env:
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      VOICE_NAME: "Luo Xiang"
      PRIMESPEECH_MODEL_DIR: $HOME/.dora/models/primespeech
      TEXT_LANG: zh
      PROMPT_LANG: zh
      TOP_K: 5
      TOP_P: 1.0
      TEMPERATURE: 1.0
      SPEED_FACTOR: 1.0
      USE_GPU: false
      NUM_THREADS: 4
      RETURN_FRAGMENT: "false"
      LOG_LEVEL: INFO
      ENABLE_INTERNAL_SEGMENTATION: "true"
      TTS_MAX_SEGMENT_LENGTH: "100"
      TTS_MIN_SEGMENT_LENGTH: "20"

  # ============ Makepad Dashboard (replaces audio-player + debate-monitor) ============
  # Run with: DORA_NODE_ID=dashboard cargo run
  # From: examples/conference-dashboard/

  - id: dashboard
    path: dynamic
    inputs:
      # Audio from TTS
      audio:
        source: primespeech-tutor/audio
        queue_size: 1000

      # Participant text streams (for display)
      student1_text:
        source: student1/text
        queue_size: 1000
      student2_text:
        source: student2/text
        queue_size: 1000
      tutor_text:
        source: tutor/text
        queue_size: 1000

      # Participant status
      student1_status: student1/status
      student2_status: student2/status
      tutor_status: tutor/status

      # Logs from all components
      student1_log: student1/log
      student2_log: student2/log
      tutor_log: tutor/log
      segmenter_log: tutor-text-segmenter/log
      tts_log: primespeech-tutor/log
      controller_log: conference-controller/log

      # Bridge status
      bridge1_log: bridge-to-tutor/log
      bridge2_log: bridge-to-student2/log
      bridge3_log: bridge-to-student1/log

    outputs:
      - control      # Send/Reset buttons -> conference-controller
      - session_end  # Audio completion -> conference-controller
      - status       # Buffer status
      - log          # Dashboard logs

  # ============ 3 Conference Bridges ============

  - id: bridge-to-tutor
    path: ../../target/release/dora-conference-bridge
    env:
      LOG_LEVEL: INFO
      STREAMING_PORTS: student1,tutor,student2
      ERROR_MESSAGE_TEMPLATE: "[{participant} is experiencing technical difficulties.]"
      DORA_STUDY_MODE: "true"
    inputs:
      student1:
        source: student1/text
        queue_size: 1000
      student2:
        source: student2/text
        queue_size: 1000
      control:
        source: conference-controller/control_judge
        queue_size: 10
    outputs:
      - text
      - status
      - log

  - id: bridge-to-student2
    path: ../../target/release/dora-conference-bridge
    env:
      LOG_LEVEL: INFO
      STREAMING_PORTS: student1,tutor,student2
      ERROR_MESSAGE_TEMPLATE: "[{participant} is experiencing technical difficulties.]"
      DORA_STUDY_MODE: "true"
    inputs:
      student1:
        source: student1/text
        queue_size: 1000
      tutor:
        source: tutor/text
        queue_size: 1000
      control:
        source: conference-controller/control_llm2
        queue_size: 10
    outputs:
      - text
      - status
      - log

  - id: bridge-to-student1
    path: ../../target/release/dora-conference-bridge
    env:
      LOG_LEVEL: INFO
      STREAMING_PORTS: student1,tutor,student2
      ERROR_MESSAGE_TEMPLATE: "[{participant} is experiencing technical difficulties.]"
      DORA_STUDY_MODE: "true"
    inputs:
      student2:
        source: student2/text
        queue_size: 1000
      tutor:
        source: tutor/text
        queue_size: 1000
      control:
        source: conference-controller/control_llm1
        queue_size: 10
    outputs:
      - text
      - status
      - log

  # ============ Conference Controller ============

  - id: conference-controller
    path: ../../target/release/dora-conference-controller
    env:
      DORA_POLICY_PATTERN: "[(tutor, *), (student2, 2), (student1, 1)]"
      INITIAL_QUESTION_ID: 1
    inputs:
      student1:
        source: student1/text
        queue_size: 1000
      student2:
        source: student2/text
        queue_size: 1000
      tutor:
        source: tutor/text
        queue_size: 1000
      # Control from dashboard (Send/Reset buttons)
      control: dashboard/control
      # Session end from dashboard audio player
      session_end: dashboard/session_end
    outputs:
      - control_judge
      - control_llm2
      - control_llm1
      - llm_control
      - judge_prompt
      - status
      - log

  # ============ Viewer (optional - for additional logging) ============

  - id: viewer
    path: dynamic
    inputs:
      student1_log: student1/log
      student2_log: student2/log
      tutor_log: tutor/log
      segmenter_log: tutor-text-segmenter/log
      tts_log: primespeech-tutor/log
      controller_log: conference-controller/log
      dashboard_log: dashboard/log
