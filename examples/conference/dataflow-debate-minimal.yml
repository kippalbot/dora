# Minimal Conference Debate Example
# No monitors, just controller + bridge + LLMs
# Sequential policy: llm1 → llm2 → judge

nodes:
  # LLM Participants
  - id: llm1
    operator:
      rust: dora-maas-client
    inputs:
      text: conference-bridge/text
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: ./debate_config_maas_llm1.toml
      ALIBABA_CLOUD_API_KEY: ${ALIBABA_CLOUD_API_KEY:-}
      LOG_LEVEL: INFO

  - id: llm2
    operator:
      rust: dora-maas-client
    inputs:
      text: conference-bridge/text
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: ./debate_config_maas_llm2.toml
      ALIBABA_CLOUD_API_KEY: ${ALIBABA_CLOUD_API_KEY:-}
      LOG_LEVEL: INFO

  - id: judge
    operator:
      rust: dora-maas-client
    inputs:
      text: conference-bridge/text
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: ./debate_config_maas_judge.toml
      ALIBABA_CLOUD_API_KEY: ${ALIBABA_CLOUD_API_KEY:-}
      LOG_LEVEL: INFO

  # Conference Controller - brain
  - id: conference-controller
    operator:
      rust: dora-conference-controller
    env:
      DORA_POLICY_PATTERN: "[llm1 → llm2 → judge]"
    inputs:
      llm1: llm1/text
      llm2: llm2/text
      judge: judge/text
    outputs:
      - control
      - status

  # Conference Bridge - switch
  - id: conference-bridge
    operator:
      rust: dora-conference-bridge
    env:
      LOG_LEVEL: INFO
    inputs:
      llm1: llm1/text
      llm2: llm2/text
      judge: judge/text
      control:
        source: conference-controller/control
        queue_size: 10
    outputs:
      - text
      - status
      - log
