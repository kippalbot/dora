[package]
name = "debate-monitor-tui"
edition = "2021"
version = "0.1.0"

[dependencies]
dora-node-api = "0.3.12"
eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.28.0"
crossterm = "0.28.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
chrono = "0.4"

[[bin]]
name = "debate-monitor-tui"
path = "src/main.rs"

[[bin]]
name = "diagnostic"
path = "src/bin/diagnostic.rs"

[[bin]]
name = "simple-ui"
path = "src/bin/simple_ui.rs"
